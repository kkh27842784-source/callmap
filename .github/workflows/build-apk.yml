name: 콜맵 APK 자동 빌드

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 자바 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 그래들 설치
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 콜맵 압축 풀기
        shell: bash
        run: |
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP 파일을 찾지 못했습니다."
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d project

      - name: 안드로이드 프로젝트 찾기
        shell: bash
        run: |
          PROJECT_DIR=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "안드로이드 프로젝트를 찾지 못했습니다."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "프로젝트 위치: $PROJECT_DIR"

      - name: APK 만들기
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon

      - name: APK 저장
        uses: actions/upload-artifact@v4
        with:
          name: 콜맵-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: APK 공개 파일 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "callmap-build-${{ github.run_number }}" \
            "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            --title "콜맵 APK 빌드 ${{ github.run_number }}" \
            --notes "콜맵 자동 빌드 APK"
